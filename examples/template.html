<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Template - midiwire</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>🎛️ Starter Template</h1>

  <div id="status" class="status">Initializing MIDI...</div>

  <div class="section">
    <h2>MIDI Configuration</h2>
    <label for="device-select">Output Device</label>
    <select id="device-select">
      <option value="">Select a device</option>
    </select>

    <label for="channel-select" style="margin-top: 15px;">MIDI Channel</label>
    <select id="channel-select">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
      <option value="16">16</option>
    </select>
  </div>

  <div id="connect-message" class="section">
    <h2>Not Connected</h2>
    <p style="color: var(--text-secondary); margin-top: 10px;">
      Connect a MIDI device to begin controlling your instruments.
    </p>
  </div>

  <div id="controls-container" class="container" style="margin-top: 30px; display: none;">
    <div class="section">
      <h2>Your Controls (Left)</h2>
    </div>

    <div class="section">
      <h2>Your Controls (Right)</h2>
    </div>
  </div>

  <script type="module">
    import { createMIDIDeviceManager } from "../src/index.js";

    async function init() {
      try {
        // Cache DOM elements
        const status = document.getElementById("status");
        const controlsContainer = document.getElementById("controls-container");
        const connectMessage = document.getElementById("connect-message");

        // Create a MIDIDeviceManager with integrated MIDIController
        const deviceManager = await createMIDIDeviceManager({
          onStatusUpdate: (message, state) => {
            status.textContent = message;
            status.className = state ? `status ${state}` : "status";
          },
          onConnectionUpdate: (device, midi) => {
            if (device && midi) {
              status.textContent = `Connected to ${device.name} (Channel ${midi.options.channel})`;
              status.className = "status connected";
              controlsContainer.style.display = "grid";
              connectMessage.style.display = "none";
            } else {
              controlsContainer.style.display = "none";
              connectMessage.style.display = "block";
            }
          },
          onReady: (midi) => {
            // Make MIDI globally available for debugging
            window.midi = midi;
          }
        });

        // Set up device and channel selection
        const deviceSelect = document.getElementById("device-select");
        const channelSelect = document.getElementById("channel-select");

        deviceManager.setupDeviceListeners(() => {
          deviceManager.populateDeviceList(deviceSelect);
        });

        // Initial population
        deviceManager.populateDeviceList(deviceSelect);
        deviceManager.connectDeviceSelection(deviceSelect);
        deviceManager.connectChannelSelection(channelSelect);
      } catch (err) {
        const status = document.getElementById("status");
        status.textContent = `MIDI initialization failed: ${err.message}`;
        status.className = "status error";
      }
    }

    init();
  </script>
</body>
</html>
