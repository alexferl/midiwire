<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Controller - midiwire</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>🎛️ Basic MIDI Controller Example</h1>

  <div id="status" class="status">Initializing MIDI...</div>

  <div class="section">
    <h2>MIDI Configuration</h2>
    <label for="device-select">Output Device</label>
    <select id="device-select">
      <option value="">Select a device</option>
    </select>

    <label for="channel-select" style="margin-top: 15px;">MIDI Channel</label>
    <select id="channel-select">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
      <option value="16">16</option>
    </select>
  </div>

  <div id="connect-message" class="section">
    <h2>Not Connected</h2>
    <p style="color: var(--text-secondary); margin-top: 10px;">
      Connect a MIDI device to begin controlling your instruments.
    </p>
  </div>

  <div id="controls-container" class="container" style="margin-top: 30px; display: none;">
    <div class="section">
      <h2>Notes (Pad Controller)</h2>
      <div class="button-grid">
        <button data-midi-note="false" data-midi-number="60">C</button>
        <button data-midi-note="false" data-midi-number="61">C#</button>
        <button data-midi-note="false" data-midi-number="62">D</button>
        <button data-midi-note="false" data-midi-number="63">D#</button>
        <button data-midi-note="false" data-midi-number="64">E</button>
        <button data-midi-note="false" data-midi-number="65">F</button>
        <button data-midi-note="false" data-midi-number="66">F#</button>
        <button data-midi-note="false" data-midi-number="67">G</button>
        <button data-midi-note="false" data-midi-number="68">G#</button>
        <button data-midi-note="false" data-midi-number="69">A</button>
        <button data-midi-note="false" data-midi-number="70">A#</button>
        <button data-midi-note="false" data-midi-number="71">B</button>
        <button data-midi-note="false" data-midi-number="72">C5</button>
        <button data-midi-note="false" data-midi-number="73">C#5</button>
        <button data-midi-note="false" data-midi-number="74">D5</button>
        <button data-midi-note="false" data-midi-number="75">D#5</button>
      </div>
    </div>

    <div class="section">
      <h2>CC Controls</h2>
      <div class="sliders">
        <div class="slider-row">
          <label for="cc-1">CC1</label>
          <input id="cc-1" type="range" min="0" max="127" value="64" data-midi-cc="1">
          <span data-display-cc="1">64</span>
        </div>
        <div class="slider-row">
          <label for="cc-2">CC2</label>
          <input id="cc-2" type="range" min="0" max="127" value="64" data-midi-cc="2">
          <span data-display-cc="2">64</span>
        </div>
        <div class="slider-row">
          <label for="cc-7">CC7</label>
          <input id="cc-7" type="range" min="0" max="127" value="64" data-midi-cc="7">
          <span data-display-cc="7">64</span>
        </div>
        <div class="slider-row">
          <label for="cc-74">CC74</label>
          <input id="cc-74" type="range" min="0" max="127" value="64" data-midi-cc="74">
          <span data-display-cc="74">64</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createMIDIDeviceManager, DataAttributeBinder } from "../src/index.js";

    async function init() {
      try {
        // Cache DOM elements
        const status = document.getElementById("status");
        const controlsContainer = document.getElementById("controls-container");
        const connectMessage = document.getElementById("connect-message");

        // Create a MIDIDeviceManager with integrated MIDIController
        const deviceManager = await createMIDIDeviceManager({
          onStatusUpdate: (message, state) => {
            status.textContent = message;
            status.className = state ? `status ${state}` : "status";
          },
          onConnectionUpdate: (device, midi) => {
            if (device && midi) {
              status.textContent = `Connected to ${device.name} (Channel ${midi.options.channel})`;
              status.className = "status connected";
              controlsContainer.style.display = "grid";
              connectMessage.style.display = "none";
            } else {
              controlsContainer.style.display = "none";
              connectMessage.style.display = "block";
            }
          },
          onReady: async (midi) => {
            // Bind CC sliders using the data attribute binder
            const binder = new DataAttributeBinder(midi, "[data-midi-cc]");
            binder.bindAll();

            // Bind note buttons manually
            document.querySelectorAll("[data-midi-number]").forEach(button => {
              const note = parseInt(button.dataset.midiNumber, 10);
              const noteName = button.textContent;

              button.addEventListener("mousedown", () => {
                console.log(`Note ON: ${noteName} (note ${note}, velocity 100, channel ${midi.options.channel})`);
                midi.channel.sendNoteOn(note, 100);
              });

              button.addEventListener("mouseup", () => {
                console.log(`Note OFF: ${noteName} (note ${note}, channel ${midi.options.channel})`);
                midi.channel.sendNoteOff(note);
              });

              button.addEventListener("mouseleave", () => {
                console.log(`Note OFF: ${noteName} (note ${note}, channel ${midi.options.channel})`);
                midi.channel.sendNoteOff(note);
              });
            });

            // Make MIDI globally available for debugging
            window.midi = midi;
          }
        });

        // Set up device and channel selection
        const deviceSelect = document.getElementById("device-select");
        const channelSelect = document.getElementById("channel-select");

        deviceManager.setupDeviceListeners(async () => {
          await deviceManager.output.populateDeviceList(deviceSelect);
        });

        // Initial population
        await deviceManager.output.populateDeviceList(deviceSelect);
        deviceManager.output.connectDeviceSelection(deviceSelect);
        deviceManager.output.connectChannelSelection(channelSelect);

        // Set up CC display updates (independent of MIDI connection)
        document.querySelectorAll("[data-midi-cc]").forEach(slider => {
          // Initialize display with current value
          const cc = slider.dataset.midiCc;
          const display = document.querySelector(`[data-display-cc="${cc}"]`);
          if (display) {
            display.textContent = slider.value;
          }

          // Update display and log on input
          slider.addEventListener("input", (e) => {
            const cc = e.currentTarget.dataset.midiCc;
            const value = e.currentTarget.value;
            const display = document.querySelector(`[data-display-cc="${cc}"]`);
            if (display) {
              display.textContent = value;
            }
            // Log CC changes (these will be sent via the DataAttributeBinder)
            console.log(`CC Change: CC${cc} = ${value}`);
          });
        });
      } catch (err) {
        const status = document.getElementById("status");
        status.textContent = `MIDI initialization failed: ${err.message}`;
        status.className = "status error";
      }
    }

    init();
  </script>
</body>
</html>
