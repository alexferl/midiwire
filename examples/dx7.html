<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DX7 Voice Manager - midiwire</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .file-input-wrapper {
      margin-bottom: 0;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-input-label {
      display: inline-block;
      padding: 12px 24px;
      background: var(--primary);
      color: var(--bg);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .file-input-label:hover {
      opacity: 0.9;
    }

    .loaded-bank {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 15px;
    }

    .bank-details h3 {
      margin: 0 0 5px 0;
      color: var(--text);
      font-size: 16px;
    }

    .bank-details p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .voice-count {
      background: var(--primary);
      color: var(--bg);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
    }

    .voice-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .voice-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      transition: all 0.2s ease;
    }

    .voice-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .voice-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .voice-number {
      background: var(--primary);
      color: var(--bg);
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      min-width: 28px;
      text-align: center;
    }

    .voice-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .voice-actions {
      display: flex;
      gap: 6px;
    }

    .voice-actions button {
      flex: 1;
      padding: 6px 12px;
      font-size: 12px;
      margin: 0;
    }

    .voice-actions .button-primary {
      background: var(--primary);
      color: var(--bg);
    }

    .voice-actions .button-secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .voice-actions .button-primary.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      position: relative;
    }

    .voice-actions .button-primary.disabled:hover {
      opacity: 1 !important;
      background: rgba(6, 182, 212, 0.5) !important;
    }

    .voice-actions .button-primary.disabled[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #000000 !important;
      color: #ffffff !important;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      margin-bottom: 8px;
      z-index: 1000;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8) !important;
      border: 1px solid #06b6d4 !important;
      opacity: 1 !important;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--bg);
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .button-content {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>🎹 DX7 Voice Manager</h1>

  <div id="status" class="status">Initializing MIDI...</div>

  <div class="section">
    <h2>MIDI Configuration</h2>
    <label for="device-select">Output Device</label>
    <select id="device-select">
      <option value="">Select a device</option>
    </select>

    <label for="channel-select" style="margin-top: 15px;">MIDI Channel</label>
    <select id="channel-select">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
      <option value="16">16</option>
    </select>
  </div>

  <div class="section">
    <h2>Voice Library</h2>

    <p style="margin-bottom: 15px; font-size: 13px; color: var(--text-secondary);">
      Supports DX7 bank files (32 voices) and single voices (VCED format)
    </p>

    <div class="file-input-wrapper">
      <label for="bank-file" class="file-input-label">
        📁 Load SYX File
      </label>
      <input type="file" id="bank-file" accept=".syx">
    </div>

    <div id="loaded-bank" class="loaded-bank" style="display: none;">
      <div class="bank-details">
        <h3 id="bank-name-display">No bank loaded</h3>
        <p id="bank-stats-display">Select a SYX file to begin</p>
      </div>
      <div class="voice-count" id="voice-count-display">0 voices</div>
    </div>
  </div>

  <div id="voice-section" class="section" style="display: none;">
    <h2>Patches</h2>
    <div id="voice-list" class="voice-list"></div>
  </div>

  <script type="module">
    import { createMIDIDeviceManager, DX7Bank, DX7Voice } from "../src/index.js";

    let bank = null;
    let deviceManager = null;

    const status = document.getElementById("status");
    const fileInput = document.getElementById("bank-file");
    const voiceSection = document.getElementById("voice-section");
    const voiceList = document.getElementById("voice-list");

    async function initMIDI() {
      try {
        deviceManager = await createMIDIDeviceManager({
          sysex: true, // Enable SysEx for DX7 voice dumps
          onStatusUpdate: (message, state) => {
            status.textContent = message;
            status.className = state ? `status ${state}` : "status";
          },
          onConnectionUpdate: (device, midiInstance) => {
            if (device && midiInstance) {
              status.textContent = `Connected to ${device.name}`;
              status.className = "status connected";
            }
            updateSendButtons();
          },
          onReady: (_midiInstance) => {
            updateSendButtons();
          }
        });

        const deviceSelect = document.getElementById("device-select");
        const channelSelect = document.getElementById("channel-select");

        deviceManager.setupDeviceListeners(() => {
          deviceManager.populateDeviceList(deviceSelect);
        });

        deviceManager.populateDeviceList(deviceSelect);
        deviceManager.connectDeviceSelection(deviceSelect);
        deviceManager.connectChannelSelection(channelSelect);
      } catch (err) {
        status.textContent = `MIDI initialization failed: ${err.message}`;
        status.className = "status error";
      }
    }

    async function loadBankFile(file) {
      try {
        status.textContent = `Loading ${file.name}...`;

        try {
          // Try to load as a bank first
          bank = await DX7Bank.fromFile(file);
          displayBank();
          status.textContent = `Loaded bank: ${file.name}`;
          status.className = "status success";
        } catch (err) {
          // If it's a single voice file, DX7Bank.fromFile will throw an error
          if (err.message?.includes("Use DX7Voice.fromFile")) {
            // Load as single voice instead
            const voice = await DX7Voice.fromFile(file);

            // Create a bank with the single voice
            bank = new DX7Bank();
            bank.voices.fill(DX7Voice.createDefault());
            bank.voices[0] = voice;
            bank.name = file.name;

            displayBank();
            status.textContent = `Loaded single voice: ${voice.name}`;
            status.className = "status success";
          } else {
            // Re-throw if it's a different error
            throw err;
          }
        }
      } catch (err) {
        status.textContent = `Error loading file: ${err.message}`;
        status.className = "status error";
        console.error(err);
      }
    }

    // Update the state of Send to DX7 buttons based on MIDI connection
    function updateSendButtons() {
      const sendButtons = document.querySelectorAll(".voice-actions .button-primary");
      const isConnected = deviceManager?.midi?.connection?.output;

      sendButtons.forEach(button => {
        button.style.opacity = isConnected ? "1" : "0.5";
        button.style.cursor = isConnected ? "pointer" : "not-allowed";

        if (isConnected) {
          button.classList.remove("disabled");
          button.removeAttribute("data-tooltip");
        } else {
          button.classList.add("disabled");
          button.setAttribute("data-tooltip", "Connect to a MIDI device first");
        }
      });
    }

    function displayBank() {
      if (!bank) return;

      const loadedBank = document.getElementById("loaded-bank");
      const bankNameDisplay = document.getElementById("bank-name-display");
      const bankStatsDisplay = document.getElementById("bank-stats-display");
      const voiceCountDisplay = document.getElementById("voice-count-display");

      loadedBank.style.display = "flex";
      bankNameDisplay.textContent = bank.name || "Unnamed Bank";

      // Detect if this is a single voice file
      const actualVoices = bank.voices.filter(v => v.name && v.name !== "Init Voice" && v.name !== "");
      const isSingleVoice = actualVoices.length === 1;

      if (isSingleVoice) {
        bankStatsDisplay.textContent = "DX7 Single Voice";
        voiceCountDisplay.textContent = "1 voice";
      } else {
        bankStatsDisplay.textContent = "DX7 Bank File";
        voiceCountDisplay.textContent = `${bank.voices.length} voices`;
      }

      voiceSection.style.display = "block";

      voiceList.innerHTML = "";

      // Only display actual voices (not default filler voices for single voice files)
      const voicesToDisplay = isSingleVoice ? actualVoices : bank.voices;
      const voiceIndices = isSingleVoice ? [bank.voices.indexOf(actualVoices[0])] : bank.voices.map((_, i) => i);

      voicesToDisplay.forEach((voice, displayIndex) => {
        const card = document.createElement("div");
        card.className = "voice-card";

        const voiceName = voice.name || "(Empty)";
        const originalIndex = isSingleVoice ? voiceIndices[0] : displayIndex;

        const isConnected = deviceManager?.midi?.connection?.output;

        const sendButtonClass = isConnected ? "button button-primary" : "button button-primary disabled";

        card.innerHTML = `
          <div class="voice-header">
            <span class="voice-number">${originalIndex + 1}</span>
            <h3 class="voice-name" title="${voiceName}">${voiceName}</h3>
          </div>
          <div class="voice-actions">
            <button class="${sendButtonClass}" ${!isConnected ? 'data-tooltip="Connect to a MIDI device first"' : ''} onclick="sendPatch(${originalIndex}, this)">
              <span class="button-content">
                <span class="spinner" style="display: none;"></span>
                <span class="button-text">Send to DX7</span>
              </span>
            </button>
            <button class="button button-secondary" onclick="exportPatch(${originalIndex})">
              Export SYX
            </button>
            <button class="button button-secondary" onclick="exportPatchJSON(${originalIndex})">
              Export JSON
            </button>
          </div>
        `;

        voiceList.appendChild(card);
      });

      updateSendButtons();
    }

    window.sendPatch = (index, button) => {
      if (!bank || !deviceManager?.midi?.connection?.output) {
        status.textContent = "Error: No bank loaded or MIDI not connected";
        status.className = "status error";
        return;
      }

      const spinner = button.querySelector('.spinner');
      const buttonText = button.querySelector('.button-text');
      spinner.style.display = 'inline-block';
      buttonText.textContent = 'Sending...';
      button.disabled = true;

      try {
        const voice = bank.voices[index];
        const sysex = voice.toSysEx();

        // Note: toSysEx() already includes the 0xF0/0xF7 wrapper
        deviceManager.midi.sendSysEx(sysex);

        status.textContent = `Sent "${voice.name}" to DX7`;
        status.className = "status success";
      } catch (err) {
        status.textContent = `Error sending voice: ${err.message}`;
        status.className = "status error";
        console.error(err);
      } finally {
        setTimeout(() => {
          spinner.style.display = 'none';
          buttonText.textContent = 'Send to DX7';
          button.disabled = false;
        }, 500);
      }
    };

    window.exportPatch = (index) => {
      if (!bank) {
        status.textContent = "Error: No bank loaded";
        status.className = "status error";
        return;
      }

      try {
        const voice = bank.voices[index];
        const sysex = voice.toSysEx();

        // Check if this is a single voice file by counting non-default voices
        const nonDefaultVoices = bank.voices.filter(v => v.name && v.name !== "Init Voice" && v.name !== "").length;
        const isSingleVoiceFile = nonDefaultVoices === 1;

        let fileName;
        if (isSingleVoiceFile) {
          // For single voice files, use the original filename
          fileName = bank.name;
        } else {
          // For bank files, append the voice name
          const voiceName = voice.name || "voice";
          const safeName = voiceName.replace(/[^a-zA-Z0-9]/g, "_");
          const bankFileName = bank.name ? bank.name.replace(/\.[^/.]+$/, "") : "";
          const safeBankName = bankFileName.replace(/[^a-zA-Z0-9]/g, "_");
          fileName = safeBankName ? `${safeBankName}_${safeName}.syx` : `${safeName}.syx`;
        }

        const blob = new Blob([sysex], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);

        status.textContent = `Exported "${voice.name}"`;
        status.className = "status success";
      } catch (err) {
        status.textContent = `Error exporting voice: ${err.message}`;
        status.className = "status error";
        console.error(err);
      }
    };

    window.exportPatchJSON = (index) => {
      if (!bank) {
        status.textContent = "Error: No bank loaded";
        status.className = "status error";
        return;
      }

      try {
        const voice = bank.voices[index];
        const jsonData = voice.toJSON();

        // Check if this is a single voice file (bank.name is the original filename)
        // or a bank file (bank.name doesn't end with .syx)
        const isSingleVoiceFile = bank.name?.toLowerCase().endsWith(".syx");

        let fileName;
        if (isSingleVoiceFile) {
          // For single voice files, use the original filename without the patch name
          fileName = `${bank.name.replace(/\.[^/.]+$/, "")}.json`;
        } else {
          // For bank files, append the voice name
          const voiceName = voice.name || "voice";
          const safeName = voiceName.replace(/[^a-zA-Z0-9]/g, "_");
          const bankFileName = bank.name ? bank.name.replace(/\.[^/.]+$/, "") : "";
          const safeBankName = bankFileName.replace(/[^a-zA-Z0-9]/g, "_");
          fileName = safeBankName ? `${safeBankName}_${safeName}.json` : `${safeName}.json`;
        }

        const jsonString = JSON.stringify(jsonData, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);

        status.textContent = `Exported "${voice.name}" as JSON`;
        status.className = "status success";
      } catch (err) {
        status.textContent = `Error exporting voice JSON: ${err.message}`;
        status.className = "status error";
        console.error(err);
      }
    };

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        loadBankFile(file);
      }
    });

    initMIDI();
  </script>
</body>
</html>
